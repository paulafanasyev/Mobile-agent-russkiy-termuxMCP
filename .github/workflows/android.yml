name: Android APK Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Сборка Android APK с реальным libbox
    runs-on: ubuntu-24.04
    steps:
      - name: Получить исходники
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23.1'
          cache: false

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.2
          run_install: false

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Android SDK и NDK
        uses: android-actions/setup-android@v4

      - name: Установить Android SDK/NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.0.13004108"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"

      - name: Собрать воспроизводимый libbox.aar
        run: bash scripts/build-libbox-android.sh

      - name: Проверить libbox
        run: |
          sha256sum -c build/native/libbox.aar.sha256
          test "$(cat build/native/sing-box-revision.txt)" = "670d7a7693918b765a17c44aee5afb5d47ead390"
          bash scripts/verify-android-agent.sh

      - name: Установить JavaScript-зависимости
        run: pnpm install --frozen-lockfile

      - name: Expo prebuild
        run: pnpm exec expo prebuild --platform android --clean

      - name: Проверить наличие AAR в Android-проекте
        run: test -s build/native/libbox.aar

      - name: Собрать отладочный APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Найти APK
        id: apk
        shell: bash
        run: |
          APK=$(find android/app/build/outputs/apk -type f -name '*.apk' | head -1)
          test -n "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK=$APK"

      - name: Загрузить APK как artifact
        uses: actions/upload-artifact@v5
        with:
          name: mobile-agent-russkiy-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Опубликовать сведения о сборке
        run: |
          echo "libbox revision: $(cat build/native/sing-box-revision.txt)"
          echo "libbox SHA256: $(cut -d' ' -f1 build/native/libbox.aar.sha256)"
