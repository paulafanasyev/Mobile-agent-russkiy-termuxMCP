name: Сборка libbox Android

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-libbox-android.yml'
      - 'scripts/build-libbox-android.sh'
      - 'modules/firewall/**'

jobs:
  build-libbox:
    name: Сборка libbox.aar ARM64
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Установить Go 1.24.7
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.7'
          cache: false

      - name: Установить Android SDK и NDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-21 platforms;android-23 platforms;android-35 build-tools;35.0.0 ndk;28.0.13004108'

      - name: Проверить Android окружение
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME не установлен setup-android}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          java -version
          go version
          sdkmanager --version
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/28.0.13004108"
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          test -d "$ANDROID_HOME/platforms/android-21"
          test -d "$ANDROID_HOME/platforms/android-23"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -x "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"

      - name: Собрать libbox.aar воспроизводимым скриптом
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/logs"
          bash scripts/build-libbox-android.sh 2>&1 | tee "$RUNNER_TEMP/logs/libbox-build.log"

      - name: Проверить AAR и контрольную сумму
        shell: bash
        run: |
          set -euo pipefail
          test -s build/native/libbox.aar
          test -s build/native/sing-box-revision.txt
          test -s build/native/libbox.aar.sha256
          sha256sum -c build/native/libbox.aar.sha256
          unzip -t build/native/libbox.aar >/dev/null
          echo "===== REVISION ====="
          cat build/native/sing-box-revision.txt
          echo "===== SHA256 ====="
          cat build/native/libbox.aar.sha256
          echo "===== AAR ====="
          stat -c '%n %s bytes' build/native/libbox.aar

      - name: Опубликовать libbox AAR
        uses: actions/upload-artifact@v4
        with:
          name: libbox-android-arm64
          path: |
            build/native/libbox.aar
            build/native/libbox.aar.sha256
            build/native/sing-box-revision.txt
          if-no-files-found: error
          retention-days: 14

      - name: Опубликовать лог сборки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libbox-build-log
          path: ${{ runner.temp }}/logs/libbox-build.log
          if-no-files-found: ignore
          retention-days: 7
