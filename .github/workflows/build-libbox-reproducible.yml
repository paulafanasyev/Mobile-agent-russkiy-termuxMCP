name: Воспроизводимая сборка libbox Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build-libbox-android.sh'
      - 'scripts/README-libbox-android.md'
      - 'Makefile'
      - '.github/workflows/build-libbox-reproducible.yml'

permissions:
  contents: read

jobs:
  build:
    name: libbox.aar ARM64 из закреплённого исходника
    runs-on: ubuntu-24.04
    steps:
      - name: Получить проект
        uses: actions/checkout@v5

      - name: Установить Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Установить Go 1.24.7
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.7'
          cache: false

      - name: Установить Android SDK и NDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;28.0.13004108'

      - name: Проверить окружение
        run: |
          java -version
          go version
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/28.0.13004108"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
          test -x "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"

      - name: Выполнить ту же сборку, что и локально
        run: bash scripts/build-libbox-android.sh

      - name: Проверить revision
        run: test "$(cat build/native/sing-box-revision.txt)" = "670d7a7693918b765a17c44aee5afb5d47ead390"

      - name: Проверить SHA256
        run: sha256sum -c build/native/libbox.aar.sha256

      - name: Опубликовать проверенный AAR как artifact
        uses: actions/upload-artifact@v5
        with:
          name: libbox-android-arm64-reproducible
          path: |
            build/native/libbox.aar
            build/native/sing-box-revision.txt
            build/native/libbox.aar.sha256
          if-no-files-found: error
          retention-days: 14
