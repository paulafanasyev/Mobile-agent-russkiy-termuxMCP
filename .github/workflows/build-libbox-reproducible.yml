name: Воспроизводимая сборка libbox Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build-libbox-android.sh'
      - 'scripts/README-libbox-android.md'
      - 'Makefile'
      - '.github/workflows/build-libbox-reproducible.yml'

permissions:
  contents: read

jobs:
  build:
    name: libbox.aar ARM64 из закреплённого исходника
    runs-on: ubuntu-24.04
    steps:
      - name: Получить проект
        uses: actions/checkout@v5

      - name: Установить Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Установить Go 1.24.7
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.7'
          cache: false

      - name: Установить Android SDK и NDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-21 platforms;android-23 platforms;android-35 build-tools;35.0.0 ndk;28.0.13004108'

      - name: Проверить Android окружение
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME не установлен setup-android}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          java -version
          go version
          sdkmanager --version
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/28.0.13004108"
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          test -d "$ANDROID_HOME/platforms/android-21"
          test -d "$ANDROID_HOME/platforms/android-23"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -x "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"

      - name: Выполнить ту же сборку, что и локально
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/logs"
          bash scripts/build-libbox-android.sh 2>&1 | tee "$RUNNER_TEMP/logs/libbox-build.log"

      - name: Проверить AAR
        shell: bash
        run: |
          set -euo pipefail
          test -s build/native/libbox.aar
          test -s build/native/sing-box-revision.txt
          test -s build/native/libbox.aar.sha256
          sha256sum -c build/native/libbox.aar.sha256
          unzip -t build/native/libbox.aar >/dev/null
          test "$(cat build/native/sing-box-revision.txt)" = "670d7a7693918b765a17c44aee5afb5d47ead390"
          stat -c '%n %s bytes' build/native/libbox.aar

      - name: Опубликовать проверенный AAR как artifact
        uses: actions/upload-artifact@v5
        with:
          name: libbox-android-arm64-reproducible
          path: |
            build/native/libbox.aar
            build/native/sing-box-revision.txt
            build/native/libbox.aar.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Опубликовать лог сборки
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: libbox-build-log
          path: ${{ runner.temp }}/logs/libbox-build.log
          if-no-files-found: ignore
          retention-days: 7
